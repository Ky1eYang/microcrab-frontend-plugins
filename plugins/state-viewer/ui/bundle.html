<style>
:root {
  --bg-base: #0a0c10;
  --bg-card: rgba(22, 27, 34, 0.7);
  --bg-card-hover: rgba(30, 37, 48, 0.85);
  --bg-input: #11141c;
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(59, 130, 246, 0.5);
  --text-main: #f0f6fc;
  --text-sub: #8b949e;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.25);
  --badge-green: #238636;
  --badge-purple: #8957e5;
  --badge-amber: #d29922;
  --badge-red: #f85149;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-base);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  padding: 12px;
  min-height: 100vh;
}

/* Header toolbar */
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
  position: sticky;
  top: 0;
  background: rgba(10, 12, 16, 0.9);
  backdrop-filter: blur(12px);
  padding: 6px 0;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}

.search-wrap {
  position: relative;
  flex: 1;
  max-width: 320px;
}

.search-input {
  width: 100%;
  padding: 6px 10px 6px 28px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-main);
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.search-input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-sub);
  width: 14px;
  height: 14px;
  pointer-events: none;
}

.actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.15);
}

.btn-primary {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
}

.btn-primary:hover {
  background: #2563eb;
  box-shadow: 0 0 10px var(--accent-glow);
}

.btn.active {
  background: rgba(59, 130, 246, 0.2);
  border-color: var(--accent);
  color: var(--accent);
}

/* Stats */
.meta-summary {
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Card list */
.vars-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.var-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  transition: all 0.15s ease;
}

.var-card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(255, 255, 255, 0.12);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.card-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 12px;
  color: #58a6ff;
  word-break: break-all;
}

.card-badges {
  display: flex;
  align-items: center;
  gap: 4px;
}

.badge {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.badge-visible { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
.badge-invisible { background: rgba(139, 148, 158, 0.15); color: var(--text-sub); border: 1px solid var(--border); }
.badge-persisted { background: rgba(137, 87, 229, 0.2); color: #a371f7; border: 1px solid rgba(163, 113, 247, 0.3); }
.badge-locked { background: rgba(210, 153, 34, 0.2); color: #e3b341; border: 1px solid rgba(227, 179, 65, 0.3); }

/* Value preview */
.val-preview {
  background: rgba(0, 0, 0, 0.3);
  padding: 6px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: #e6edf3;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  border: 1px solid rgba(255, 255, 255, 0.04);
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid rgba(255, 255, 255, 0.04);
}

.card-ops {
  display: flex;
  gap: 6px;
}

.btn-sm {
  padding: 3px 8px;
  font-size: 11px;
}

/* Modal Drawer */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-overlay.open {
  display: flex;
}

.modal-box {
  background: #141824;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  width: 100%;
  max-width: 520px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.editor-field label {
  display: block;
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 4px;
}

.editor-textarea {
  width: 100%;
  height: 180px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: #f0f6fc;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px;
  outline: none;
  resize: vertical;
}

.editor-textarea:focus {
  border-color: var(--border-focus);
}

.modal-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  background: rgba(0, 0, 0, 0.2);
}

.alert-msg {
  color: var(--badge-red);
  font-size: 11px;
}

.search-empty-box {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-sub);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.search-empty-box p {
  font-size: 12px;
  color: var(--text-main);
}


</style>

<div class="header-bar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 16 16" fill="currentColor">
      <path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0zm-.82 4.74a6 6 0 1 0-1.06 1.06l3.66 3.66a.75.75 0 1 0 1.06-1.06l-3.66-3.66z"/>
    </svg>
    <input id="search" class="search-input" type="search" placeholder="搜索状态字段或值...">
  </div>
  <div class="actions">
    <button id="btn-invisible" class="btn" title="切换显示模型不可见字段">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 2c-3.5 0-6.5 2.5-7.5 6 1 3.5 4 6 7.5 6s6.5-2.5 7.5-6c-1-3.5-4-6-7.5-6zm0 10c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4zm0-6.5c-1.4 0-2.5 1.1-2.5 2.5S6.6 10.5 8 10.5 10.5 9.4 10.5 8 9.4 5.5 8 5.5z"/>
      </svg>
    </button>
    <button id="btn-refresh" class="btn" title="刷新状态">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1.705 8.001a6.3 6.3 0 0 1 10.51-4.708l.707-.707A.75.75 0 0 1 14.25 3.12v3.38a.75.75 0 0 1-.75.75H10.12a.75.75 0 0 1-.53-1.28l.84-.84a4.8 4.8 0 1 0-.96 6.87.75.75 0 0 1 .94 1.17 6.3 6.3 0 0 1-8.715-5.169z"/>
      </svg>
    </button>
    <button id="btn-new" class="btn btn-primary">+ 新建变量</button>
  </div>
</div>

<div id="summary" class="meta-summary"></div>
<div id="vars-list" class="vars-grid"></div>

<!-- Edit Drawer / Modal -->
<div id="edit-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title" style="font-size:13px;font-weight:600;">编辑变量</h3>
    </div>
    <div class="modal-body">
      <div class="editor-field">
        <label for="modal-key">变量名称 (Key)</label>
        <input id="modal-key" class="search-input" type="text" style="padding-left:10px;">
      </div>
      <div class="editor-field">
        <label for="modal-val">值 (JSON 格式 / 字符串)</label>
        <textarea id="modal-val" class="editor-textarea" spellcheck="false"></textarea>
      </div>
      <div id="modal-alert" class="alert-msg"></div>
    </div>
    <div class="modal-footer">
      <button id="modal-cancel" class="btn">取消</button>
      <button id="modal-save" class="btn btn-primary">保存变更</button>
    </div>
  </div>
</div>

<!-- Inline Delete Confirmation Modal (Replaces native window.confirm) -->
<div id="delete-modal" class="modal-overlay">
  <div class="modal-box" style="max-width:380px;">
    <div class="modal-header">
      <h3 style="font-size:13px;font-weight:600;color:var(--badge-red);">确认删除变量</h3>
    </div>
    <div class="modal-body">
      <p id="delete-msg" style="color:var(--text-main);font-size:12px;">确定要从会话状态中删除该变量吗？</p>
    </div>
    <div class="modal-footer">
      <button id="delete-cancel" class="btn">取消</button>
      <button id="delete-confirm" class="btn" style="background:var(--badge-red);color:#fff;border-color:transparent;">确认删除</button>
    </div>
  </div>
</div>

<script>
(function () {
  let state = (function() {
    try {
      const injected = /*INITIAL_STATE*/;
      if (injected && typeof injected === "object") {
        return injected;
      }
    } catch (_) {}
    return {
      values: {},
      metadata: {},
      loading: false,
      has_snapshot: false,
      search: "",
      show_invisible: false,
      error: "",
      locale: "zh-CN"
    };
  })();

  const isZh = () => !String(state.locale || "").toLowerCase().startsWith("en");

  const i18n = {
    searchPlaceholder: () => isZh() ? "搜索字段名或值..." : "Search key or value...",
    fieldsCount: (total, ro) => isZh() ? `共 ${total} 个字段 (${ro} 个只读)` : `${total} fields (${ro} read-only)`,
    loading: () => isZh() ? "正在读取会话状态..." : "Loading state...",
    empty: () => isZh() ? "当前会话暂无状态数据" : "No state data in current session",
    noMatches: (q) => isZh() ? `未找到匹配 "${q}" 的变量` : `No variables match "${q}"`,
    clearSearch: () => isZh() ? "清空筛选" : "Clear Filter",
    showInvisible: () => isZh() ? "显示隐藏字段" : "Show hidden fields",
    hideInvisible: () => isZh() ? "隐藏内部字段" : "Hide hidden fields",
    refresh: () => isZh() ? "刷新" : "Refresh",
    newField: () => isZh() ? "+ 新建变量" : "+ New Variable",
    readOnly: () => isZh() ? "只读受保护" : "Read Only",
    edit: () => isZh() ? "编辑" : "Edit",
    delete: () => isZh() ? "删除" : "Delete",
    save: () => isZh() ? "保存变更" : "Save Changes",
    cancel: () => isZh() ? "取消" : "Cancel",
    confirmDeletePrompt: (key) => isZh() ? `确定要从会话状态中删除变量 "${key}" 吗？此操作无法撤销。` : `Are you sure you want to delete variable "${key}"? This cannot be undone.`,
    invalidJson: () => isZh() ? "无效的 JSON 格式" : "Invalid JSON syntax",
    cannotEditReadOnly: () => isZh() ? "此字段受只读保护，不可修改" : "This field is read-only protected"
  };

  // DOM elements
  const el = {
    search: document.getElementById("search"),
    summary: document.getElementById("summary"),
    btnInvisible: document.getElementById("btn-invisible"),
    btnRefresh: document.getElementById("btn-refresh"),
    btnNew: document.getElementById("btn-new"),
    list: document.getElementById("vars-list"),
    // Edit Modal
    modal: document.getElementById("edit-modal"),
    modalTitle: document.getElementById("modal-title"),
    modalKey: document.getElementById("modal-key"),
    modalVal: document.getElementById("modal-val"),
    modalAlert: document.getElementById("modal-alert"),
    btnModalSave: document.getElementById("modal-save"),
    btnModalCancel: document.getElementById("modal-cancel"),
    // Delete Modal
    deleteModal: document.getElementById("delete-modal"),
    deleteMsg: document.getElementById("delete-msg"),
    btnDeleteConfirm: document.getElementById("delete-confirm"),
    btnDeleteCancel: document.getElementById("delete-cancel")
  };

  let activeEditKey = null;
  let isCreatingNew = false;
  let pendingDeleteKey = null;

  function isReadOnly(key) {
    const meta = state.metadata ? state.metadata[key] : null;
    if (!meta) return false;
    if (Array.isArray(meta.editors)) {
      return !meta.editors.includes("client");
    }
    return false;
  }

  function render() {
    el.search.placeholder = i18n.searchPlaceholder();
    el.btnNew.textContent = i18n.newField();
    el.btnInvisible.classList.toggle("active", Boolean(state.show_invisible));
    el.btnInvisible.title = state.show_invisible ? i18n.hideInvisible() : i18n.showInvisible();

    const allKeys = Object.keys(state.values || {}).sort();

    // 1. If currently loading and no snapshot exists yet
    if (state.loading && !state.has_snapshot && allKeys.length === 0) {
      el.list.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-sub);">${i18n.loading()}</div>`;
      el.summary.textContent = "";
      return;
    }

    // 2. Count visible vs invisible eligible keys
    let eligible = 0;
    let readOnlyCount = 0;
    const query = (el.search.value || "").trim().toLowerCase();

    for (const k of allKeys) {
      const meta = state.metadata ? state.metadata[k] : null;
      const isInvisible = meta && meta.visibility === "invisible";
      if (isInvisible && !state.show_invisible) continue;
      eligible++;
      if (isReadOnly(k)) readOnlyCount++;
    }

    el.summary.textContent = i18n.fieldsCount(eligible, readOnlyCount);

    // 3. If there are truly zero fields in the session
    if (eligible === 0) {
      el.list.innerHTML = `<div style="text-align:center;padding:32px;color:var(--text-sub);">${i18n.empty()}</div>`;
      return;
    }

    // 4. Filter by search query
    const matchedKeys = allKeys.filter(k => {
      const meta = state.metadata ? state.metadata[k] : null;
      const isInvisible = meta && meta.visibility === "invisible";
      if (isInvisible && !state.show_invisible) return false;

      if (!query) return true;
      const valStr = JSON.stringify(state.values[k] || "").toLowerCase();
      return k.toLowerCase().includes(query) || valStr.includes(query);
    });

    // 5. If search query yielded no matches (Differentiate from empty session!)
    if (matchedKeys.length === 0) {
      el.list.innerHTML = `
        <div class="search-empty-box">
          <p>${i18n.noMatches(escapeHtml(query))}</p>
          <button id="btn-clear-search" class="btn btn-sm">${i18n.clearSearch()}</button>
        </div>
      `;
      const btnClear = document.getElementById("btn-clear-search");
      if (btnClear) {
        btnClear.addEventListener("click", () => {
          el.search.value = "";
          render();
        });
      }
      return;
    }

    let html = "";
    for (const key of matchedKeys) {
      const val = state.values[key];
      const meta = state.metadata ? state.metadata[key] : {};
      const ro = isReadOnly(key);
      const valFormatted = typeof val === "object" ? JSON.stringify(val, null, 2) : String(val);
      const type = Array.isArray(val) ? "array" : typeof val;

      const isInvisible = meta.visibility === "invisible";
      const isPersisted = meta.persistence === "persisted";

      html += `
        <div class="var-card" data-key="${escapeHtml(key)}">
          <div class="card-header">
            <div class="card-title">
              <span>${escapeHtml(key)}</span>
              <span style="font-size:10px;color:var(--text-sub);">(${type})</span>
            </div>
            <div class="card-badges">
              ${isInvisible ? `<span class="badge badge-invisible">Invisible</span>` : `<span class="badge badge-visible">Visible</span>`}
              ${isPersisted ? `<span class="badge badge-persisted">Persisted</span>` : ""}
              ${ro ? `<span class="badge badge-locked">🔒 ${i18n.readOnly()}</span>` : ""}
            </div>
          </div>
          <div class="val-preview">${escapeHtml(valFormatted)}</div>
          <div class="card-footer">
            <div style="font-size:11px;color:var(--text-sub);">
              ${ro ? "只读保护不可删除" : "Client-owned"}
            </div>
            <div class="card-ops">
              ${!ro ? `<button class="btn btn-sm op-edit" data-key="${escapeHtml(key)}">${i18n.edit()}</button>` : ""}
              ${!ro ? `<button class="btn btn-sm op-del" data-key="${escapeHtml(key)}" style="color:var(--badge-red);">${i18n.delete()}</button>` : ""}
            </div>
          </div>
        </div>
      `;
    }

    el.list.innerHTML = html;

    // Attach buttons
    el.list.querySelectorAll(".op-edit").forEach(btn => {
      btn.addEventListener("click", () => openEditModal(btn.dataset.key, false));
    });
    el.list.querySelectorAll(".op-del").forEach(btn => {
      btn.addEventListener("click", () => openDeleteModal(btn.dataset.key));
    });
  }

  function openEditModal(key, isNew) {
    isCreatingNew = isNew;
    activeEditKey = key;
    el.modalAlert.textContent = "";

    if (isNew) {
      el.modalTitle.textContent = i18n.newField();
      el.modalKey.value = "";
      el.modalKey.disabled = false;
      el.modalVal.value = "{\n  \"example\": true\n}";
      el.btnModalSave.disabled = false;
    } else {
      el.modalTitle.textContent = `${i18n.edit()}: ${key}`;
      el.modalKey.value = key;
      el.modalKey.disabled = true;
      const val = state.values[key];
      el.modalVal.value = JSON.stringify(val, null, 2);

      if (isReadOnly(key)) {
        el.modalAlert.textContent = i18n.cannotEditReadOnly();
        el.btnModalSave.disabled = true;
      } else {
        el.btnModalSave.disabled = false;
      }
    }

    el.modal.classList.add("open");
  }

  function closeEditModal() {
    el.modal.classList.remove("open");
  }

  function saveModal() {
    const key = el.modalKey.value.trim();
    if (!key) {
      el.modalAlert.textContent = "变量名不可为空";
      return;
    }

    let parsedVal;
    try {
      parsedVal = JSON.parse(el.modalVal.value);
    } catch {
      parsedVal = el.modalVal.value;
    }

    if (window.microcrab && window.microcrab.action) {
      window.microcrab.action("save-json", {
        key: key,
        value: parsedVal,
        is_new: isCreatingNew
      });
    }

    closeEditModal();
  }

  // Custom Inline Delete Modal to avoid sandbox window.confirm failure
  function openDeleteModal(key) {
    pendingDeleteKey = key;
    el.deleteMsg.textContent = i18n.confirmDeletePrompt(key);
    el.deleteModal.classList.add("open");
  }

  function closeDeleteModal() {
    pendingDeleteKey = null;
    el.deleteModal.classList.remove("open");
  }

  function confirmDelete() {
    if (pendingDeleteKey && window.microcrab && window.microcrab.action) {
      window.microcrab.action("delete-field", { key: pendingDeleteKey });
    }
    closeDeleteModal();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // Events
  el.search.addEventListener("input", render);
  el.btnInvisible.addEventListener("click", () => {
    if (window.microcrab && window.microcrab.action) {
      window.microcrab.action("toggle-invisible", {});
    }
  });
  el.btnRefresh.addEventListener("click", () => {
    if (window.microcrab && window.microcrab.action) {
      window.microcrab.action("refresh", {});
    }
  });
  el.btnNew.addEventListener("click", () => openEditModal("", true));
  el.btnModalCancel.addEventListener("click", closeEditModal);
  el.btnModalSave.addEventListener("click", saveModal);

  el.btnDeleteCancel.addEventListener("click", closeDeleteModal);
  el.btnDeleteConfirm.addEventListener("click", confirmDelete);

  // microcrab state listener
  if (window.microcrab && window.microcrab.onViewState) {
    window.microcrab.onViewState((next) => {
      if (next && typeof next === "object") {
        state = { ...state, ...next };
        render();
      }
    });
  }

  // Initial render
  render();
})();

</script>
