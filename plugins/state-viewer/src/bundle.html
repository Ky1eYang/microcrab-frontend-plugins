<style>
:root {
  --bg-base: #0a0c10;
  --bg-card: rgba(22, 27, 34, 0.7);
  --bg-card-hover: rgba(30, 37, 48, 0.85);
  --bg-input: #11141c;
  --border: rgba(255, 255, 255, 0.08);
  --border-focus: rgba(59, 130, 246, 0.5);
  --text-main: #f0f6fc;
  --text-sub: #8b949e;
  --accent: #3b82f6;
  --accent-glow: rgba(59, 130, 246, 0.25);
  --badge-green: #238636;
  --badge-purple: #8957e5;
  --badge-amber: #d29922;
  --badge-red: #f85149;
  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: var(--bg-base);
  color: var(--text-main);
  font-family: var(--font-sans);
  font-size: 13px;
  line-height: 1.5;
  padding: 12px;
  min-height: 100vh;
}

/* Header toolbar */
.header-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 12px;
  position: sticky;
  top: 0;
  background: rgba(10, 12, 16, 0.9);
  backdrop-filter: blur(12px);
  padding: 6px 0;
  z-index: 10;
  border-bottom: 1px solid var(--border);
}

.search-wrap {
  position: relative;
  flex: 1;
  max-width: 320px;
}

.search-input {
  width: 100%;
  padding: 6px 10px 6px 28px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-main);
  font-size: 12px;
  outline: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.search-input:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--accent-glow);
}

.search-icon {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-sub);
  width: 14px;
  height: 14px;
  pointer-events: none;
}

.actions {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: 500;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-main);
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn:hover {
  background: rgba(255, 255, 255, 0.08);
  border-color: rgba(255, 255, 255, 0.15);
}

.btn-primary {
  background: var(--accent);
  border-color: transparent;
  color: #fff;
}

.btn-primary:hover {
  background: #2563eb;
  box-shadow: 0 0 10px var(--accent-glow);
}

.btn.active {
  background: rgba(59, 130, 246, 0.25);
  border-color: var(--accent);
  color: #58a6ff;
  box-shadow: 0 0 8px var(--accent-glow);
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.btn.spinning svg {
  animation: spin 0.75s linear infinite;
}

.toast {
  position: fixed;
  top: 48px;
  left: 50%;
  transform: translateX(-50%) translateY(-8px);
  background: rgba(18, 22, 32, 0.95);
  border: 1px solid var(--accent);
  color: var(--text-main);
  padding: 6px 14px;
  border-radius: 6px;
  font-size: 11px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
  pointer-events: none;
  opacity: 0;
  transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
  z-index: 1000;
  white-space: nowrap;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.var-owner {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-sub);
}

.owner-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  flex-shrink: 0;
}

.owner-client {
  background: #3fb950;
  box-shadow: 0 0 6px rgba(63, 185, 80, 0.5);
}

.owner-agent {
  background: #a371f7;
  box-shadow: 0 0 6px rgba(163, 113, 247, 0.5);
}

.owner-system {
  background: #8b949e;
}

.badge-custom {
  background: rgba(59, 130, 246, 0.15);
  color: #58a6ff;
  border: 1px solid rgba(59, 130, 246, 0.3);
}

.badge-framework {
  background: rgba(139, 148, 158, 0.15);
  color: #8b949e;
  border: 1px solid var(--border);
}

.badge-reference {
  background: rgba(210, 153, 34, 0.15);
  color: #e3b341;
  border: 1px solid rgba(227, 179, 65, 0.3);
}

/* Stats */
.meta-summary {
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* Card list */
.vars-grid {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.var-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  transition: all 0.15s ease;
}

.var-card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(255, 255, 255, 0.12);
}

.card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}

.card-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-weight: 600;
  font-size: 12px;
  color: #58a6ff;
  word-break: break-all;
}

.card-badges {
  display: flex;
  align-items: center;
  gap: 4px;
}

.badge {
  font-size: 10px;
  font-weight: 500;
  padding: 1px 6px;
  border-radius: 12px;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}

.badge-visible { background: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
.badge-invisible { background: rgba(139, 148, 158, 0.15); color: var(--text-sub); border: 1px solid var(--border); }
.badge-persisted { background: rgba(137, 87, 229, 0.2); color: #a371f7; border: 1px solid rgba(163, 113, 247, 0.3); }
.badge-locked { background: rgba(210, 153, 34, 0.2); color: #e3b341; border: 1px solid rgba(227, 179, 65, 0.3); }

/* Value preview */
.val-preview {
  background: rgba(0, 0, 0, 0.3);
  padding: 6px 8px;
  border-radius: 4px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: #e6edf3;
  overflow-x: auto;
  white-space: pre-wrap;
  word-break: break-all;
  border: 1px solid rgba(255, 255, 255, 0.04);
}

.card-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px solid var(--border);
}

.action-buttons {
  display: flex;
  align-items: center;
  gap: 6px;
}

.btn-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 26px;
  height: 26px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.04);
  color: var(--text-sub);
  cursor: pointer;
  transition: all 0.15s ease;
  padding: 0;
}

.btn-icon:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.1);
  color: var(--text-main);
  border-color: rgba(255, 255, 255, 0.2);
}

.btn-icon-danger:hover:not(:disabled) {
  background: rgba(239, 68, 68, 0.15);
  color: var(--badge-red);
  border-color: rgba(239, 68, 68, 0.3);
}

.btn-icon:disabled {
  opacity: 0.25;
  cursor: not-allowed;
  pointer-events: auto; /* Ensure tooltip shows on hover */
}

/* Modal Drawer */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(6px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.modal-overlay.open {
  display: flex;
}

.modal-box {
  background: #141824;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 10px;
  width: 100%;
  max-width: 520px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.modal-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-body {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.editor-field label {
  display: block;
  font-size: 11px;
  color: var(--text-sub);
  margin-bottom: 4px;
}

.editor-textarea {
  width: 100%;
  height: 180px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: #f0f6fc;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 8px;
  outline: none;
  resize: vertical;
}

.editor-textarea:focus {
  border-color: var(--border-focus);
}

.modal-footer {
  padding: 12px 16px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  background: rgba(0, 0, 0, 0.2);
}

.alert-msg {
  color: var(--badge-red);
  font-size: 11px;
}

.search-empty-box {
  text-align: center;
  padding: 32px 16px;
  color: var(--text-sub);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
}

.search-empty-box p {
  font-size: 12px;
  color: var(--text-main);
}


</style>

<div class="header-bar">
  <div class="search-wrap">
    <svg class="search-icon" viewBox="0 0 16 16" fill="currentColor">
      <path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0zm-.82 4.74a6 6 0 1 0-1.06 1.06l3.66 3.66a.75.75 0 1 0 1.06-1.06l-3.66-3.66z"/>
    </svg>
    <input id="search" class="search-input" type="search" placeholder="搜索状态字段或值...">
  </div>
  <div class="actions">
    <button id="btn-invisible" class="btn" title="切换显示模型不可见字段">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 2c-3.5 0-6.5 2.5-7.5 6 1 3.5 4 6 7.5 6s6.5-2.5 7.5-6c-1-3.5-4-6-7.5-6zm0 10c-2.2 0-4-1.8-4-4s1.8-4 4-4 4 1.8 4 4-1.8 4-4 4zm0-6.5c-1.4 0-2.5 1.1-2.5 2.5S6.6 10.5 8 10.5 10.5 9.4 10.5 8 9.4 5.5 8 5.5z"/>
      </svg>
    </button>
    <button id="btn-refresh" class="btn" title="刷新状态">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1.705 8.001a6.3 6.3 0 0 1 10.51-4.708l.707-.707A.75.75 0 0 1 14.25 3.12v3.38a.75.75 0 0 1-.75.75H10.12a.75.75 0 0 1-.53-1.28l.84-.84a4.8 4.8 0 1 0-.96 6.87.75.75 0 0 1 .94 1.17 6.3 6.3 0 0 1-8.715-5.169z"/>
      </svg>
    </button>
    <button id="btn-new" class="btn btn-primary">+ 新建变量</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<div id="summary" class="meta-summary"></div>
<div id="vars-list" class="vars-grid"></div>

<!-- Edit Drawer / Modal -->
<div id="edit-modal" class="modal-overlay">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title" style="font-size:13px;font-weight:600;">编辑变量</h3>
    </div>
    <div class="modal-body">
      <div class="editor-field">
        <label for="modal-key">变量名称 (Key)</label>
        <input id="modal-key" class="search-input" type="text" style="padding-left:10px;">
      </div>
      <div class="editor-field">
        <label for="modal-val">值 (JSON 格式 / 字符串)</label>
        <textarea id="modal-val" class="editor-textarea" spellcheck="false"></textarea>
      </div>
      <div id="modal-alert" class="alert-msg"></div>
    </div>
    <div class="modal-footer">
      <button id="modal-cancel" class="btn">取消</button>
      <button id="modal-save" class="btn btn-primary">保存变更</button>
    </div>
  </div>
</div>

<!-- Inline Delete Confirmation Modal (Replaces native window.confirm) -->
<div id="delete-modal" class="modal-overlay">
  <div class="modal-box" style="max-width:380px;">
    <div class="modal-header">
      <h3 style="font-size:13px;font-weight:600;color:var(--badge-red);">确认删除变量</h3>
    </div>
    <div class="modal-body">
      <p id="delete-msg" style="color:var(--text-main);font-size:12px;">确定要从会话状态中删除该变量吗？</p>
    </div>
    <div class="modal-footer">
      <button id="delete-cancel" class="btn">取消</button>
      <button id="delete-confirm" class="btn" style="background:var(--badge-red);color:#fff;border-color:transparent;">确认删除</button>
    </div>
  </div>
</div>

<script>
(function () {
  let state = {
    values: {},
    metadata: {},
    descriptors: {},
    loading: true,
    has_snapshot: false,
    search: "",
    show_invisible: false,
    error: "",
    locale: "zh-CN"
  };

  const isZh = () => !String(state.locale || "").toLowerCase().startsWith("en");

  const i18n = {
    searchPlaceholder: () => isZh() ? "搜索字段名或值..." : "Search key or value...",
    fieldsCount: (total, ro) => isZh() ? `共 ${total} 个字段 (${ro} 个只读)` : `${total} fields (${ro} read-only)`,
    loading: () => isZh() ? "正在读取会话状态..." : "Loading state...",
    empty: () => isZh() ? "当前会话暂无状态数据" : "No state data in current session",
    noMatches: (q) => isZh() ? `未找到匹配 "${q}" 的变量` : `No variables match "${q}"`,
    clearSearch: () => isZh() ? "清空筛选" : "Clear Filter",
    showInvisible: () => isZh() ? "显示隐藏字段" : "Show hidden fields",
    hideInvisible: () => isZh() ? "隐藏内部字段" : "Hide hidden fields",
    refresh: () => isZh() ? "刷新" : "Refresh",
    newField: () => isZh() ? "+ 新建变量" : "+ New Variable",
    readOnly: () => isZh() ? "只读受保护" : "Read Only",
    save: () => isZh() ? "保存变更" : "Save Changes",
    cancel: () => isZh() ? "取消" : "Cancel",
    confirmDeletePrompt: (key) => isZh() ? `确定要从会话状态中删除变量 "${key}" 吗？此操作无法撤销。` : `Are you sure you want to delete variable "${key}"? This cannot be undone.`,
    invalidJson: () => isZh() ? "无效的 JSON 格式" : "Invalid JSON syntax",
    cannotEditReadOnly: () => isZh() ? "此字段受只读保护，不可修改" : "This field is read-only protected"
  };

  const ICONS = {
    edit: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
    trash: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>`
  };

  // DOM elements
  const el = {
    search: document.getElementById("search"),
    summary: document.getElementById("summary"),
    btnInvisible: document.getElementById("btn-invisible"),
    btnRefresh: document.getElementById("btn-refresh"),
    btnNew: document.getElementById("btn-new"),
    list: document.getElementById("vars-list"),
    toast: document.getElementById("toast"),
    // Edit Modal
    modal: document.getElementById("edit-modal"),
    modalTitle: document.getElementById("modal-title"),
    modalKey: document.getElementById("modal-key"),
    modalVal: document.getElementById("modal-val"),
    modalAlert: document.getElementById("modal-alert"),
    btnModalSave: document.getElementById("modal-save"),
    btnModalCancel: document.getElementById("modal-cancel"),
    // Delete Modal
    deleteModal: document.getElementById("delete-modal"),
    deleteMsg: document.getElementById("delete-msg"),
    btnDeleteConfirm: document.getElementById("delete-confirm"),
    btnDeleteCancel: document.getElementById("delete-cancel")
  };

  let toastTimer = null;
  function showToast(msg, duration = 1800) {
    if (!el.toast) return;
    if (toastTimer) clearTimeout(toastTimer);
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    toastTimer = setTimeout(() => {
      el.toast.classList.remove("show");
      toastTimer = null;
    }, duration);
  }

  let activeEditKey = null;
  let isCreatingNew = false;
  let pendingDeleteKey = null;

  function getVarDescriptor(key) {
    return (state.descriptors && state.descriptors[key]) || null;
  }

  function getVarMetadata(key) {
    return (state.metadata && state.metadata[key]) || null;
  }

  function getVarKind(key) {
    const desc = getVarDescriptor(key);
    if (desc && desc.kind) return desc.kind;
    const meta = getVarMetadata(key);
    if (meta) return "custom";
    return "framework";
  }

  function getVarOwner(key) {
    const meta = getVarMetadata(key);
    if (meta && meta.owner) {
      if (meta.owner === "client") return { label: isZh() ? "客户端 (Client-owned)" : "Client-owned", cls: "owner-client" };
      if (meta.owner === "agent") return { label: isZh() ? "智能体 (Agent-owned)" : "Agent-owned", cls: "owner-agent" };
      if (meta.owner === "runtime") return { label: isZh() ? "会话运行时 (Runtime-owned)" : "Runtime-owned", cls: "owner-system" };
      return { label: `${meta.owner}-owned`, cls: "owner-system" };
    }
    const desc = getVarDescriptor(key);
    if (desc) {
      if (desc.kind === "framework") return { label: isZh() ? "框架内置 (Framework-owned)" : "Framework-owned", cls: "owner-system" };
      if (desc.kind === "reference") return { label: isZh() ? "只读引用 (Reference-owned)" : "Reference-owned", cls: "owner-system" };
      if (desc.kind === "custom") return { label: isZh() ? "客户端 (Client-owned)" : "Client-owned", cls: "owner-client" };
    }
    return { label: isZh() ? "系统运行时 (Runtime-owned)" : "Runtime-owned", cls: "owner-system" };
  }

  function canEdit(key) {
    const desc = getVarDescriptor(key);
    if (desc) {
      return Boolean(desc.kind === "custom" && desc.editable);
    }
    const meta = getVarMetadata(key);
    if (meta && Array.isArray(meta.editors)) {
      return meta.editors.includes("client");
    }
    return false;
  }

  function canDelete(key) {
    const desc = getVarDescriptor(key);
    if (desc) {
      return Boolean(desc.kind === "custom" && desc.deletable);
    }
    const meta = getVarMetadata(key);
    if (meta && meta.owner) {
      return meta.owner === "client";
    }
    return false;
  }

  function getEditDisabledReason(key) {
    const desc = getVarDescriptor(key);
    if (desc && desc.reason) return desc.reason;
    if (!canEdit(key)) {
      return isZh() ? "此变量非客户端所有或缺少 client 编辑权限" : "Variable is read-only or missing client edit rights";
    }
    return isZh() ? "编辑此变量" : "Edit variable";
  }

  function getDeleteDisabledReason(key) {
    const desc = getVarDescriptor(key);
    if (desc && desc.reason) return desc.reason;
    if (!canDelete(key)) {
      return isZh() ? "此变量非客户端所有 (Owner 不是 client)，无法删除" : "Variable not owned by client (cannot delete)";
    }
    return isZh() ? "删除此变量" : "Delete variable";
  }

  function render() {
    el.search.placeholder = i18n.searchPlaceholder();
    el.btnNew.textContent = i18n.newField();
    el.btnInvisible.classList.toggle("active", Boolean(state.show_invisible));
    el.btnInvisible.title = state.show_invisible ? i18n.hideInvisible() : i18n.showInvisible();

    const allKeys = Object.keys(state.values || {}).sort();

    // 1. If currently loading and no snapshot exists yet
    if (state.loading && !state.has_snapshot && allKeys.length === 0) {
      el.list.innerHTML = `<div style="text-align:center;padding:24px;color:var(--text-sub);">${i18n.loading()}</div>`;
      el.summary.textContent = "";
      return;
    }

    // 2. Count visible vs invisible eligible keys
    let eligible = 0;
    let readOnlyCount = 0;
    const query = (el.search.value || "").trim().toLowerCase();

    for (const k of allKeys) {
      const meta = state.metadata ? state.metadata[k] : null;
      const isInvisible = meta && meta.visibility === "invisible";
      if (isInvisible && !state.show_invisible) continue;
      eligible++;
      if (!canEdit(k)) readOnlyCount++;
    }

    el.summary.textContent = i18n.fieldsCount(eligible, readOnlyCount);

    // 3. If there are truly zero fields in the session
    if (eligible === 0) {
      el.list.innerHTML = `<div style="text-align:center;padding:32px;color:var(--text-sub);">${i18n.empty()}</div>`;
      return;
    }

    // 4. Filter by search query
    const matchedKeys = allKeys.filter(k => {
      const meta = state.metadata ? state.metadata[k] : null;
      const isInvisible = meta && meta.visibility === "invisible";
      if (isInvisible && !state.show_invisible) return false;

      if (!query) return true;
      const valStr = JSON.stringify(state.values[k] || "").toLowerCase();
      return k.toLowerCase().includes(query) || valStr.includes(query);
    });

    // 5. If search query yielded no matches (Differentiate from empty session!)
    if (matchedKeys.length === 0) {
      el.list.innerHTML = `
        <div class="search-empty-box">
          <p>${i18n.noMatches(escapeHtml(query))}</p>
          <button id="btn-clear-search" class="btn btn-sm">${i18n.clearSearch()}</button>
        </div>
      `;
      const btnClear = document.getElementById("btn-clear-search");
      if (btnClear) {
        btnClear.addEventListener("click", () => {
          el.search.value = "";
          render();
        });
      }
      return;
    }

    let html = "";
    for (const key of matchedKeys) {
      const val = state.values[key];
      const meta = (state.metadata && state.metadata[key]) || {};
      const editable = canEdit(key);
      const deletable = canDelete(key);
      const kind = getVarKind(key);
      const ownerInfo = getVarOwner(key);

      const valFormatted = typeof val === "object" ? JSON.stringify(val, null, 2) : String(val);
      const type = Array.isArray(val) ? "array" : typeof val;

      const isInvisible = Boolean(meta.visibility === "invisible");
      const isPersisted = Boolean(meta.persistence === "persisted");

      const editTitle = getEditDisabledReason(key);
      const deleteTitle = getDeleteDisabledReason(key);

      let kindBadgeClass = "badge-framework";
      let kindBadgeText = "Framework";
      if (kind === "custom") {
        kindBadgeClass = "badge-custom";
        kindBadgeText = "Custom";
      } else if (kind === "reference") {
        kindBadgeClass = "badge-reference";
        kindBadgeText = "Reference";
      }

      html += `
        <div class="var-card" data-key="${escapeHtml(key)}">
          <div class="card-header">
            <div class="card-title">
              <span>${escapeHtml(key)}</span>
              <span style="font-size:10px;color:var(--text-sub);">(${type})</span>
            </div>
            <div class="card-badges">
              <span class="badge ${kindBadgeClass}">${kindBadgeText}</span>
              ${isInvisible ? `<span class="badge badge-invisible">Invisible</span>` : `<span class="badge badge-visible">Visible</span>`}
              ${isPersisted ? `<span class="badge badge-persisted">Persisted</span>` : ""}
              ${!editable ? `<span class="badge badge-locked">🔒 ${i18n.readOnly()}</span>` : ""}
            </div>
          </div>
          <div class="val-preview">${escapeHtml(valFormatted)}</div>
          <div class="card-footer">
            <div class="var-owner">
              <span class="owner-dot ${ownerInfo.cls}"></span>
              <span>${escapeHtml(ownerInfo.label)}</span>
            </div>
            <div class="action-buttons">
              <button 
                class="btn-icon op-edit" 
                data-key="${escapeHtml(key)}" 
                title="${escapeHtml(editTitle)}"
                ${!editable ? "disabled" : ""}
              >
                ${ICONS.edit}
              </button>
              <button 
                class="btn-icon btn-icon-danger op-del" 
                data-key="${escapeHtml(key)}" 
                title="${escapeHtml(deleteTitle)}"
                ${!deletable ? "disabled" : ""}
              >
                ${ICONS.trash}
              </button>
            </div>
          </div>
        </div>
      `;
    }

    el.list.innerHTML = html;

    // Attach buttons with disabled guards
    el.list.querySelectorAll(".op-edit").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        openEditModal(btn.dataset.key, false);
      });
    });
    el.list.querySelectorAll(".op-del").forEach(btn => {
      btn.addEventListener("click", () => {
        if (btn.disabled) return;
        openDeleteModal(btn.dataset.key);
      });
    });
  }

  function openEditModal(key, isNew) {
    isCreatingNew = isNew;
    activeEditKey = key;
    el.modalAlert.textContent = "";

    if (isNew) {
      el.modalTitle.textContent = i18n.newField();
      el.modalKey.value = "";
      el.modalKey.disabled = false;
      el.modalVal.value = "{\n  \"example\": true\n}";
      el.btnModalSave.disabled = false;
    } else {
      el.modalTitle.textContent = `${isZh() ? "编辑" : "Edit"}: ${key}`;
      el.modalKey.value = key;
      el.modalKey.disabled = true;
      const val = state.values[key];
      el.modalVal.value = JSON.stringify(val, null, 2);

      if (!canEdit(key)) {
        el.modalAlert.textContent = i18n.cannotEditReadOnly();
        el.btnModalSave.disabled = true;
      } else {
        el.btnModalSave.disabled = false;
      }
    }

    el.modal.classList.add("open");
  }

  function closeEditModal() {
    el.modal.classList.remove("open");
  }

  function saveModal() {
    const key = el.modalKey.value.trim();
    if (!key) {
      el.modalAlert.textContent = isZh() ? "变量名不可为空" : "Variable name cannot be empty";
      return;
    }

    let parsedVal;
    try {
      parsedVal = JSON.parse(el.modalVal.value);
    } catch {
      parsedVal = el.modalVal.value;
    }

    const opId = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : null;
    if (window.microcrab && window.microcrab.action) {
      window.microcrab.action("save-json", {
        operation_id: opId,
        key: key,
        value: parsedVal,
        is_new: isCreatingNew
      });
    }

    // Optimistic Local Update
    state.values = state.values || {};
    state.values[key] = parsedVal;
    if (isCreatingNew) {
      state.metadata = state.metadata || {};
      state.metadata[key] = {
        owner: "client",
        visibility: "visible",
        persistence: "persisted",
        editors: ["agent", "client", "runtime"]
      };
      state.descriptors = state.descriptors || {};
      state.descriptors[key] = {
        kind: "custom",
        editable: true,
        owner_editable: true,
        deletable: true,
        reason: null
      };
    }
    showToast(isZh() ? `已保存变量 "${key}"` : `Saved variable "${key}"`);
    render();

    closeEditModal();
  }

  // Custom Inline Delete Modal
  function openDeleteModal(key) {
    pendingDeleteKey = key;
    el.deleteMsg.textContent = i18n.confirmDeletePrompt(key);
    el.deleteModal.classList.add("open");
  }

  function closeDeleteModal() {
    pendingDeleteKey = null;
    el.deleteModal.classList.remove("open");
  }

  function confirmDelete() {
    const opId = (typeof crypto !== "undefined" && crypto.randomUUID) ? crypto.randomUUID() : null;
    if (pendingDeleteKey && window.microcrab && window.microcrab.action) {
      window.microcrab.action("delete-field", {
        operation_id: opId,
        key: pendingDeleteKey
      });
      // Optimistic Local Update
      if (state.values) {
        delete state.values[pendingDeleteKey];
        if (state.metadata) delete state.metadata[pendingDeleteKey];
        if (state.descriptors) delete state.descriptors[pendingDeleteKey];
        showToast(isZh() ? `已删除变量 "${pendingDeleteKey}"` : `Deleted variable "${pendingDeleteKey}"`);
        render();
      }
    }
    closeDeleteModal();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  // Events
  el.search.addEventListener("input", render);

  // Toggle Invisible Fields Button
  el.btnInvisible.addEventListener("click", () => {
    state.show_invisible = !state.show_invisible;
    el.btnInvisible.classList.toggle("active", Boolean(state.show_invisible));

    const allKeys = Object.keys(state.values || {});
    const hiddenCount = allKeys.filter(k => {
      const meta = state.metadata ? state.metadata[k] : null;
      return meta && meta.visibility === "invisible";
    }).length;

    if (state.show_invisible) {
      if (hiddenCount > 0) {
        showToast(isZh() ? `已显示 ${hiddenCount} 个内部隐藏字段` : `Showing ${hiddenCount} hidden fields`);
      } else {
        showToast(isZh() ? "已开启显示内部字段 (当前会话无隐藏字段)" : "Showing hidden fields (none present)");
      }
    } else {
      showToast(isZh() ? "已隐藏内部字段" : "Hidden fields concealed");
    }

    render();

    if (window.microcrab && window.microcrab.action) {
      window.microcrab.action("toggle-invisible", { show_invisible: state.show_invisible });
    }
  });

  // Refresh Button
  let refreshTimer = null;
  el.btnRefresh.addEventListener("click", () => {
    if (el.btnRefresh.disabled) return;
    el.btnRefresh.classList.add("spinning");
    el.btnRefresh.disabled = true;
    showToast(isZh() ? "正在刷新会话状态..." : "Refreshing session state...", 1500);

    if (window.microcrab && window.microcrab.action) {
      window.microcrab.action("refresh", {});
    }

    if (refreshTimer) clearTimeout(refreshTimer);
    refreshTimer = setTimeout(() => {
      el.btnRefresh.classList.remove("spinning");
      el.btnRefresh.disabled = false;
      refreshTimer = null;
    }, 2000);
  });

  el.btnNew.addEventListener("click", () => openEditModal("", true));
  el.btnModalCancel.addEventListener("click", closeEditModal);
  el.btnModalSave.addEventListener("click", saveModal);

  el.btnDeleteCancel.addEventListener("click", closeDeleteModal);
  el.btnDeleteConfirm.addEventListener("click", confirmDelete);

  // microcrab state listener
  if (window.microcrab && window.microcrab.onViewState) {
    window.microcrab.onViewState((next) => {
      if (next && typeof next === "object") {
        const wasSpinning = el.btnRefresh.classList.contains("spinning");
        state = { ...state, ...next };
        if (wasSpinning) {
          el.btnRefresh.classList.remove("spinning");
          el.btnRefresh.disabled = false;
          if (refreshTimer) {
            clearTimeout(refreshTimer);
            refreshTimer = null;
          }
          showToast(isZh() ? "状态已同步" : "State synchronized", 1500);
        }
        render();
      }
    });
  }

  // Initial render
  render();
})();

</script>
